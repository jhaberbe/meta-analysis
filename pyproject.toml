[project]
name = "meta-analysis"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "gprofiler-official>=1.0.0",
    "ipykernel>=7.2.0",
    "matplotlib>=3.10.9",
    "nbformat==4.2.0",
    "numpy>=2.4.4",
    "pandas>=3.0.3",
    "plotly>=6.7.0",
    "pytest>=9.0.3",
    "requests>=2.34.0",
    "scipy>=1.17.1",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["meta_analysis"]
